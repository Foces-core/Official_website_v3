# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Scheduled CVE audit — between-PR safety net for dependency vulnerabilities.
#
# Every PR already gates on `pnpm audit` (static checks in ci.yml), and
# Dependabot security updates open patch PRs the moment an advisory with a
# fix lands. This workflow covers the gap in between: a new advisory
# published after the last merge turns the tree vulnerable until the next
# Dependabot sweep — this job catches it within a day and files a single
# tracked issue instead of waiting for the weekly Monday bump.
#
# Requires (repo Settings → Code security): Dependabot alerts ON and
# Dependabot security updates ON — the audit detects, Dependabot patches.
name: Security audit (CVE)

on:
  schedule:
    # Tuesday 03:30 UTC — after Dependabot's Monday 06:00 IST sweep, so the
    # audit runs against a fresh lockfile and still lands mid-week.
    - cron: '30 3 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 objects.githubusercontent.com:443
            registry.npmjs.org:443
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          # Audit never pushes; do not leave the job token in .git/config
          # while third-party install scripts run (CWE-522).
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit dependencies (fail on high/critical CVEs)
        id: audit
        run: |
          pnpm audit --audit-level=high --json > audit.json || AUDIT_FAILED=1
          if [ "${AUDIT_FAILED:-0}" -eq 1 ]; then
            # Distinguish real advisories from transport errors: only file
            # an issue when the audit REPORTED vulnerabilities.
            HAS_VULNS=$(node -e "
              const a = JSON.parse(require('fs').readFileSync('audit.json', 'utf8'));
              const n = Object.values(a.advisories || {}).filter(
                (v) => v.severity === 'high' || v.severity === 'critical',
              ).length;
              console.log(n > 0 ? 'yes' : 'no');
            " 2>/dev/null || echo no)
            if [ "$HAS_VULNS" != "yes" ]; then
              echo "Audit command failed without reported advisories (registry/transport error) — not filing an issue."
              exit 1
            fi
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            {
              echo "### pnpm audit findings"
              echo '```json'
              head -c 4000 audit.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "outcome=success" >> "$GITHUB_OUTPUT"
      - name: File security issue on failure
        # Only a genuine audit failure (advisories found) files an issue —
        # infra failures (checkout/install) must not open noise.
        if: failure() && steps.audit.outputs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="security-audit: high/critical CVEs in the dependency tree"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          BODY=$(printf '%s\n' \
            "pnpm audit failed on the scheduled run ($(date -u +%Y-%m-%d))." \
            "High/critical advisories exist in the installed tree — see the failing workflow run for the JSON detail." \
            "Dependabot security updates should open (or have opened) patch PRs; merge them, then close this issue.")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "security" --label "dependencies" --body "$BODY" || \
              echo "Could not create issue (missing label?) — check the audit output above."
          fi
