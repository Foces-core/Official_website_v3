# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-runs — GitHub sometimes drops webhook-triggered runs during
  # incidents (Aug 2026), and dispatch lets maintainers run CI on any ref
  # without a push.
  workflow_dispatch:

# Cancel in-progress runs when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # StepSecurity Harden-Runner — records every outbound call the job
      # makes and flags unexpected destinations (supply-chain exfiltration
      # detection). audit mode = observe only; flip to `block` once a week of
      # logs confirms nothing legitimate is flagged.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          # Explicit allowlist for block mode — everything a JS/pnpm/Playwright
          # CI job legitimately needs. The trailing-dot registry.npmjs.org.
          # entry covers the absolute-FQDN form resolvers hand back (seen in
          # StepSecurity block notifications). Extend only with justification.
          allowed-endpoints: >
            registry.npmjs.org:443
            registry.npmjs.org.:443
            nodejs.org:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            cdn.playwright.dev:443
            playwright.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            # Ubuntu system repos (runner setup, apt-get, MOTD)
            _https._tcp.packages.microsoft.com:443
            _https._tcp.dl.google.com:443
            _http._tcp.azure.archive.ubuntu.com:80
            _https._tcp.motd.ubuntu.com:443
            motd.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            esm.ubuntu.com:443
            # Vercel analytics
            va.vercel-scripts.com:443
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Static checks (lint, format, audit, knip, workflows, assets, specs, git diff)
        run: |
          pnpm lint &
          PID_LINT=$!
          pnpm format:check &
          PID_FORMAT=$!
          pnpm audit &
          PID_AUDIT=$!
          pnpm exec knip &
          PID_KNIP=$!
          pnpm lint:workflows &
          PID_WORKFLOWS=$!
          pnpm check:assets &
          PID_ASSETS=$!
          pnpm check:specs &
          PID_SPECS=$!
          git diff --check &
          PID_DIFF=$!

          failed=0
          for pid in "$PID_LINT" "$PID_FORMAT" "$PID_AUDIT" "$PID_KNIP" "$PID_WORKFLOWS" "$PID_ASSETS" "$PID_SPECS" "$PID_DIFF"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more static checks failed"
            exit 1
          fi

      - name: Unit tests (Vitest)
        run: pnpm exec vitest run --coverage --bail 1

      - name: Cache Vite build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'index.html', 'vite.config.js') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - name: Service-worker precache check
        run: pnpm check:sw

      - name: Upload build output (optional artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          # Explicit allowlist for block mode — everything a JS/pnpm/Playwright
          # CI job legitimately needs. The trailing-dot registry.npmjs.org.
          # entry covers the absolute-FQDN form resolvers hand back (seen in
          # StepSecurity block notifications). No OS package repos here:
          # Playwright installs without --with-deps because the runner image
          # already ships Chromium's system libraries. Extend only with
          # justification.
          allowed-endpoints: >
            registry.npmjs.org:443
            registry.npmjs.org.:443
            nodejs.org:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            cdn.playwright.dev:443
            playwright.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            # Vercel analytics
            va.vercel-scripts.com:443

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Cache Vite build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'index.html', 'vite.config.js') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run E2E tests
        run: pnpm test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  probes:
    name: Probes (structural checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          # Explicit allowlist for block mode — everything a JS/pnpm/Playwright
          # CI job legitimately needs. The trailing-dot registry.npmjs.org.
          # entry covers the absolute-FQDN form resolvers hand back (seen in
          # StepSecurity block notifications). No OS package repos here:
          # Playwright installs without --with-deps because the runner image
          # already ships Chromium's system libraries. Extend only with
          # justification.
          allowed-endpoints: >
            registry.npmjs.org:443
            registry.npmjs.org.:443
            nodejs.org:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            cdn.playwright.dev:443
            playwright.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            # Vercel analytics
            va.vercel-scripts.com:443

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (Chromium used by the probes)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Cache Vite build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'index.html', 'vite.config.js') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build + serve preview
        run: |
          pnpm build
          nohup pnpm exec vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          if curl -s -o /dev/null http://localhost:4173/; then
            echo "preview up"
          else
            echo "preview failed"
            cat /tmp/preview.log
            exit 1
          fi

      - name: Run structural probes
        run: |
          # Point the puppeteer-core probes at Playwright's installed Chromium.
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          export CHROME_PATH
          pnpm probe:wcag &
          PID_WCAG=$!
          pnpm probe:carousel &
          PID_CAROUSEL=$!
          pnpm probe:mobile &
          PID_MOBILE=$!
          wait "$PID_WCAG"
          STATUS_WCAG=$?
          wait "$PID_CAROUSEL"
          STATUS_CAROUSEL=$?
          wait "$PID_MOBILE"
          STATUS_MOBILE=$?
          if [ "$STATUS_WCAG" -ne 0 ] || [ "$STATUS_CAROUSEL" -ne 0 ] || [ "$STATUS_MOBILE" -ne 0 ]; then
            echo "One or more probes failed"
            exit 1
          fi

  # Enforce Conventional Commits on every PR (same rules as the local
  # husky commit-msg hook, see commitlint.config.cjs). Also runs on manual
  # workflow_dispatch so a dispatched run reproduces the full PR check set.
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint commit messages (pull request)
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.cjs

      - name: Lint commit messages (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        # Explicit range for dispatch runs (no PR base to diff against):
        # lint every commit on this branch that isn't already on main.
        run: |
          git fetch origin main --quiet
          pnpm exec commitlint --from "$(git merge-base origin/main HEAD)" --to HEAD
    permissions:
      contents: read
      pull-requests: read

  # Reviews the dependency diff a PR introduces (unlike `pnpm audit`, which
  # only sees the current lockfile). Fails PRs that add high/critical
  # vulnerabilities or incompatible license changes.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Tell Vercel when the GitHub checks finish so deployments that "wait for
  # CI" don't hang. The `name` below must match the check name configured in
  # Vercel → Project → Settings → Git → Deployment settings → "Wait for CI
  # to pass (GitHub Checks)". Runs even on failure so Vercel marks the
  # deployment as failed instead of waiting forever.
  notify-vercel:
    name: Notify Vercel
    if: always()
    needs: [lint-and-build, e2e, probes, commitlint, dependency-review]
    runs-on: ubuntu-latest
    permissions:
      # The status action calls the Actions jobs API (actions: read) and
      # creates commit statuses (statuses: write) — contents: write is NOT
      # what it needs.
      actions: read
      statuses: write
    steps:
      # The action derives the posted state from THIS job's step conclusions
      # (main stage posts "pending", post stage the final state), so a guard
      # step fails the job — and only the job — when any dependency check
      # failed. Without it Vercel would always receive "success". Skipped
      # jobs (e.g. commitlint on push) count as green.
      - name: Guard - fail when any dependency check failed
        if: always()
        shell: bash
        run: |
          failed=""
          for r in \
            "${{ needs.lint-and-build.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.probes.result }}" \
            "${{ needs.commitlint.result }}" \
            "${{ needs.dependency-review.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              failed=1
            fi
          done
          if [ -n "$failed" ]; then
            echo "one or more checks failed — reporting failure to Vercel"
            exit 1
          fi
          echo "all checks passed"
      - name: notify vercel
        if: always()
        # Pinned to a commit using the node24 runtime — the v1 tag still ships
        # node20, which is deprecated on GH runners (renovate can digest-bump).
        uses: vercel/repository-dispatch/actions/status@61881006269f0b5ac2cb186b198c54be6afe90e1
        with:
          name: 'Vercel - focces: lint'

  # The merge gate stays closed until every check is green; once the run
  # finishes red, mention `github.actor` (the user who triggered the run,
  # usually whoever pushed). GitHub emails PR participants only per their
  # own notification settings — the same channel CodeRabbit comments use.
  notify-on-failure:
    name: Notify on failure
    if: failure() && github.event_name == 'pull_request'
    needs: [lint-and-build, e2e, probes, commitlint, dependency-review]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚨 **CI failed** on \`${sha}\` — [view the run](${run}).\n\n` +
                `@${context.actor} one of the checks (lint, format, unit, specs, build, E2E, probes, commitlint, dependency review) is red, so the merge gate stays closed.`,
            });