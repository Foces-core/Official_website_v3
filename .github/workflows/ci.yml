name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # Reads the version from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v6

      # Node 24, not 20: pnpm 11.x (see packageManager) requires Node >= 22.13,
      # and Node 20 is deprecated on GitHub runners.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Upload build output (optional artifact)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # Enforce Conventional Commits on every PR (same rules as the local
  # husky commit-msg hook, see commitlint.config.cjs).
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Node 24, not 20: pnpm 11.x (see packageManager) requires Node >= 22.13,
      # and Node 20 is deprecated on GitHub runners.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
