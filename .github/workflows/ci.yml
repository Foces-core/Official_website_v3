name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Check git diff
        run: git diff --check

      - name: pnpm audit
        run: pnpm audit

      - name: Dead code check (knip)
        run: pnpm exec knip

      - name: Orphan asset check
        run: pnpm check:assets

      - name: Unit tests (Vitest) + coverage thresholds
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm build

      - name: Service-worker precache check
        run: pnpm check:sw

      - name: Upload build output (optional artifact)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  probes:
    name: Probes (structural checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium used by the probes)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build + serve preview
        run: |
          pnpm build
          nohup pnpm exec vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          curl -s -o /dev/null http://localhost:4173/ && echo "preview up" || (echo "preview failed"; cat /tmp/preview.log; exit 1)

      - name: Run structural probes
        run: |
          # Point the puppeteer-core probes at Playwright's installed Chromium.
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          pnpm probe:wcag
          pnpm probe:carousel
          pnpm probe:mobile

  # Enforce Conventional Commits on every PR (same rules as the local
  # husky commit-msg hook, see commitlint.config.cjs).
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
