# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-runs — GitHub sometimes drops webhook-triggered runs during
  # incidents (Aug 2026), and dispatch lets maintainers run CI on any ref
  # without a push.
  workflow_dispatch:

# Cancel in-progress runs when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Check git diff
        run: git diff --check

      - name: pnpm audit
        run: pnpm audit

      - name: Dead code check (knip)
        run: pnpm exec knip

      - name: Orphan asset check
        run: pnpm check:assets

      - name: Pure-module spec check (ADR-0009)
        run: pnpm check:specs

      - name: Unit tests (Vitest) + coverage thresholds
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm build

      - name: Service-worker precache check
        run: pnpm check:sw

      - name: Upload build output (optional artifact)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  probes:
    name: Probes (structural checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium used by the probes)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build + serve preview
        run: |
          pnpm build
          nohup pnpm exec vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          if curl -s -o /dev/null http://localhost:4173/; then
            echo "preview up"
          else
            echo "preview failed"
            cat /tmp/preview.log
            exit 1
          fi

      - name: Run structural probes
        run: |
          # Point the puppeteer-core probes at Playwright's installed Chromium.
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          export CHROME_PATH
          pnpm probe:wcag
          pnpm probe:carousel
          pnpm probe:mobile

  # Enforce Conventional Commits on every PR (same rules as the local
  # husky commit-msg hook, see commitlint.config.cjs). Also runs on manual
  # workflow_dispatch so a dispatched run reproduces the full PR check set.
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages (pull request)
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

      - name: Lint commit messages (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        # Explicit range for dispatch runs (no PR base to diff against):
        # lint every commit on this branch that isn't already on main.
        run: |
          git fetch origin main --quiet
          pnpm exec commitlint --from "$(git merge-base origin/main HEAD)" --to HEAD
    permissions:
      contents: read
      pull-requests: read

  # The merge gate stays closed until every check is green; once the run
  # finishes red, mention `github.actor` (the user who triggered the run,
  # usually whoever pushed). GitHub emails PR participants only per their
  # own notification settings — the same channel CodeRabbit comments use.
  notify-on-failure:
    name: Notify on failure
    if: failure() && github.event_name == 'pull_request'
    needs: [lint-and-build, e2e, probes, commitlint]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment on the PR
        uses: actions/github-script@v8
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚨 **CI failed** on \`${sha}\` — [view the run](${run}).\n\n` +
                `@${context.actor} one of the checks (lint, format, unit, specs, build, E2E, probes, commitlint) is red, so the merge gate stays closed.`,
            });
