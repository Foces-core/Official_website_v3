# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Supply the missing approval on Renovate PRs so platform auto-merge can fire.
#
# Branch protection requires one approving review, and Renovate cannot approve
# its own PRs — so `platformAutomerge: true` in renovate.json on its own would
# queue every Renovate PR forever, waiting on an approval that never arrives
# (ADR-0021). This workflow polls the four CI checks on the PR head until they
# complete, then approves, and only when GitHub already reports auto-merge
# enabled: Renovate sets that flag itself, and only for the packageRules that
# declare `automerge: true` (minor, patch, pin, digest, lockFileMaintenance).
# Majors therefore stay
# unapproved and unmerged — humans merge those.
#
# A failing check aborts the job and leaves the PR open: nothing merges on a
# red build, because GitHub cancels auto-merge when a required check fails.
# Non-CI checks (e.g. the stale Vercel status) are deliberately ignored: they
# fail on every commit regardless of code.
name: Auto-approve Renovate PRs
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  auto-approve:
    permissions:
      pull-requests: write
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.draft == false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 objects.githubusercontent.com:443
      # Exact-name comparison, not a regex: the parentheses in
      # "E2E (Playwright)" and "Probes (structural checks)" are regex groups,
      # so a `test()` match would silently drop both of them from the gate.
      # Approval also requires all four names to be present and completed —
      # `total > 0` would approve as soon as whichever check finishes first.
      - name: Wait for CI checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 45); do
            # Fail closed: if the API call fails or returns nothing, ROW ends
            # up empty for every name below, the `*)` arm catches it, and the
            # gate reports failure instead of drifting to "approve".
            if ! RAW=$(gh api "repos/Foces-core/Official_website_v3/commits/${SHA}/check-runs" 2>/dev/null) || [ -z "$RAW" ]; then
              echo "Could not read check runs — leaving PR open."
              exit 1
            fi
            # jq's `.check_runs[]` iterates object values too, so a
            # non-array payload could still be walked. Require the array
            # the API is documented to return before iterating.
            if ! jq -e '(.check_runs | type) == "array"' >/dev/null 2>&1 <<<"$RAW"; then
              echo "Unreadable check runs response — leaving PR open."
              exit 1
            fi
            MISSING=""
            PENDING=""
            FAILED=""
            for NAME in "Lint & Build" "E2E (Playwright)" "Probes (structural checks)" "Validate commit messages"; do
              ROW=$(NAME="$NAME" jq -r '
                [.check_runs[] | select(.name == env.NAME)] | last
                | if . == null then "missing"
                  elif .status != "completed" then "pending"
                  elif (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") then "ok"
                  else "failed"
                  end' <<<"$RAW" 2>/dev/null)
              case "$ROW" in
                ok) ;;
                pending) PENDING="${PENDING}${NAME}; " ;;
                missing) MISSING="${MISSING}${NAME}; " ;;
                failed) FAILED="${FAILED}${NAME}; " ;;
                *) FAILED="${FAILED}${NAME} (status unreadable); " ;;
              esac
            done
            if [ -n "$FAILED" ]; then
              echo "A CI check failed — leaving PR open: ${FAILED}"
              exit 1
            fi
            if [ -z "$MISSING" ] && [ -z "$PENDING" ]; then
              echo "All four CI checks passed."
              exit 0
            fi
            echo "waiting — missing: ${MISSING:-none} pending: ${PENDING:-none}"
            sleep 20
          done
          echo "Timed out waiting for CI to finish."
          exit 1
      # Approve only when Renovate itself asked GitHub to queue the merge.
      # `auto_merge` is null for every other Renovate PR (majors, and anything
      # whose packageRule omits `automerge`), so those get no approval and
      # stay open for a human — this workflow never widens Renovate's scope.
      - name: Approve Renovate PR when auto-merge is enabled
        if: github.event.pull_request.state == 'open'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          MERGEABLE=$(gh api "repos/Foces-core/Official_website_v3/pulls/${PR}" --jq '.auto_merge != null')
          if [ "$MERGEABLE" != "true" ]; then
            echo "Auto-merge is not enabled on #${PR} — leaving the approval to a human."
            exit 0
          fi
          ALREADY=$(gh api "repos/Foces-core/Official_website_v3/pulls/${PR}/reviews" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')
          if [ "$ALREADY" -gt 0 ]; then
            echo "Already approved."
            exit 0
          fi
          gh pr review --approve "$PR_URL"
          echo "Approved #${PR}."
