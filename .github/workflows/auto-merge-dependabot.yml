# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Auto-merge dependabot PRs once CI passes.
#
# GitHub has no native "auto-merge dependabot PRs" flag in dependabot.yml, so
# this workflow polls the four CI checks (Lint & Build, E2E, Probes, Validate
# commit messages) on the PR head until they complete, then squash-merges the
# PR and deletes its branch. A failing check aborts the job and leaves the PR
# open — nothing merges on a red build. Non-CI checks (e.g. the stale
# Vercel official-website-v3 status) are deliberately ignored: they fail on
# every commit regardless of code.
name: Auto-merge dependabot PRs
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 objects.githubusercontent.com:443
      # Exact-name comparison, not a regex: the parentheses in
      # "E2E (Playwright)" and "Probes (structural checks)" are regex groups,
      # so a `test()` match silently dropped both and the gate only ever saw
      # Lint & Build and Validate commit messages. Approval also requires all
      # four names present and completed — `total > 0` merged as soon as the
      # first check to finish, finished.
      - name: Wait for CI checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 45); do
            RAW=$(gh api "repos/Foces-core/Official_website_v3/commits/${SHA}/check-runs")
            MISSING=""
            PENDING=""
            FAILED=""
            for NAME in "Lint & Build" "E2E (Playwright)" "Probes (structural checks)" "Validate commit messages"; do
              ROW=$(NAME="$NAME" jq -r '
                [.check_runs[] | select(.name == env.NAME)] | last
                | if . == null then "missing"
                  elif .status != "completed" then "pending"
                  elif (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") then "ok"
                  else "failed"
                  end' <<<"$RAW")
              case "$ROW" in
                ok) ;;
                pending) PENDING="${PENDING}${NAME}; " ;;
                missing) MISSING="${MISSING}${NAME}; " ;;
                failed) FAILED="${FAILED}${NAME}; " ;;
              esac
            done
            if [ -n "$FAILED" ]; then
              echo "A CI check failed — leaving PR open: ${FAILED}"
              exit 1
            fi
            if [ -z "$MISSING" ] && [ -z "$PENDING" ]; then
              echo "All four CI checks passed."
              exit 0
            fi
            echo "waiting — missing: ${MISSING:-none} pending: ${PENDING:-none}"
            sleep 20
          done
          echo "Timed out waiting for CI to finish."
          exit 1
      # Branch protection requires one approving review; dependabot cannot
      # self-approve, so the workflow approves on the bot's behalf before the
      # merge is queued.
      - name: Approve dependabot PR
        if: github.event.pull_request.state == 'open'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"
      - name: Merge (squash + delete branch)
        if: github.event.pull_request.state == 'open'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch --auto "$PR_URL"
