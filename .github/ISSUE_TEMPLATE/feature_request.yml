name: Feature request
description: Suggest an idea for the FOCES website
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting! A little context goes a long way."
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the feature look or behave like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything else you tried or thought of?
  - type: checkboxes
    id: considerations
    attributes:
      label: Considerations
      options:
        - label: Must keep the site fast — should work on slow connections / low-end phones
        - label: Should be keyboard-accessible (WCAG)
