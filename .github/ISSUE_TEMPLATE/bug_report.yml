name: Bug report
description: Report a bug on the FOCES website
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug! Fill in as much as you can."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device & browser
      multiple: true
      options:
        - Desktop / Chrome
        - Desktop / Firefox
        - Desktop / Safari
        - Desktop / Edge
        - Mobile / Android
        - Mobile / iOS
        - Other
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Paste any red errors from DevTools (F12 → Console). Empty is fine.
      render: shell
  - type: dropdown
    id: network
    attributes:
      label: Network condition
      description: This site degrades features on slow connections — was anything unusual?
      options:
        - Normal (Wi-Fi / broadband)
        - Slow connection / Data Saver
        - Not sure
