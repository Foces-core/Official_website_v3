# Dependabot — automatically opens PRs for outdated dependencies.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # The "npm" ecosystem covers pnpm lockfiles too.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    versioning-strategy: "auto"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "bot"
    # Group related bumps into single PRs to keep the queue manageable.
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "react-icons"
          - "prop-types"
      rendering-and-animation:
        patterns:
          - "swiper"
          - "aos"
          - "three"
          - "vanta"
      dev-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "eslint*"
          - "tailwindcss"
          - "postcss*"
          - "autoprefixer"
          - "vite-plugin-*"
    # three.js is a fragile peer of vanta — surface major bumps as review
    # opportunities instead of auto-PRs.
    ignore:
      - dependency-name: "three"
        update-types: ["version-update:semver-major"]

  # Legacy Sanity studio (foces-webv23) — kept in the repo for content
  # tooling, but it's a standalone Yarn project, not part of the pnpm build.
  # Blanket-ignore it so Dependabot's scheduled update job stops failing there
  # (it was trying to bump transitive deps like vite in that stale lockfile).
  - package-ecosystem: "npm"
    directory: "/foces-webv23"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "bot"
    ignore:
      - dependency-name: "*"

  # Keep GitHub Actions themselves updated.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
