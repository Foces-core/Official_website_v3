# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI code review — https://coderabbit.ai
# Config reference: https://docs.coderabbit.ai/reference/configuration
#
# NOTE: tone_instructions is schema-limited to 250 characters — keep it short.
# A longer value makes the whole config fail to parse and CodeRabbit silently
# falls back to defaults (CHILL profile), which is how reviews lost their
# strictness. Verify with `@coderabbitai configuration` on any PR.
#
# ⚠️  NO WRITE ACCESS (2026-08-15): The CodeRabbit GitHub App only has read
# permissions. Features requiring write access are disabled to prevent infinite
# retry loops ("This command requires write access" every ~15s). Disabled:
#   - request_changes_workflow (can't submit "Request Changes" reviews)
#   - slop_detection label (can't add labels to PRs)
#   - early_access / Change Stack (can't create branches)
# If an org owner grants write access later, re-enable these and set
# early_access: true. If the retry loop recurs:
#   1. Lock the affected PR/issue to stop the spam
#   2. Fix permissions at:
#      github.com/organizations/Foces-core/settings/installations → CodeRabbit
language: "en-US"
tone_instructions: >-
  Be concise, specific, and demanding. Lead with file:line. Offer concrete
  fixes. Never repeat what other linters already report.
early_access: false
enable_free_tier: true

reviews:
  # assertive is the strictest review profile CodeRabbit offers (quiet < chill
  # < assertive) — most feedback, correctness/security/a11y/perf focused.
  profile: "assertive"
  request_changes_workflow: false # OFF: needs write access (bot still comments, just can't formally block)
  auto_approve: false # never auto-approve; every merge needs human eyes
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Summarize the PR as concise release notes: a one-line subject, then a
    bullet list grouped by Conventional Commit type (feat/fix/perf/a11y/chore/
    docs/test/refactor/ci/build/style/revert). Note any perf or a11y impact.
  poem: false
  review_status: true
  review_details: true
  collapse_walkthrough: false
  sequence_diagrams: true
  abort_on_close: true
  disable_cache: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - "wip"
      - "draft"
      - "release"
    ignore_usernames: []
    labels: []

  # Files CodeRabbit should never review or clone into its workspace.
  path_filters:
    - "!foces-webv23/**" # archived Sanity studio — off-limits by repo rule
    - "!dist/**"
    - "!test-results/**"
    - "!playwright-report/**"
    - "!devserver*.log"
    - "!*.log"
    - "!.env"
    - "!pnpm-lock.yaml"

  # Project-specific guidance so CodeRabbit reviews like a FOCES maintainer.
  path_instructions:
    - path: "src/**/*.jsx"
      instructions: |
        - React 19 + Tailwind CSS + Vite 8; keep components small and focused.
        - No inline `style={{}}` objects for custom visuals — use Tailwind
          utility classes or a dedicated CSS file.
        - Never remove `useDeviceProfile` (slowNetwork/lowPower) guards or the
          AOS safety net — perf degradation is deliberate and non-negotiable.
        - Interactive elements must be keyboard-accessible (role, tabIndex,
          focus-visible styling) — target WCAG 2.1/2.2. Only one widget may
          respond to arrow keys at a time (see src/utils/keyboardLock.js).
        - Follow repo style: 2-space indent in JSX, single quotes, 100-col.
    - path: "src/**/*.css"
      instructions: |
        - Prefer Tailwind utilities; when custom CSS is needed keep it
          minimal and use 4-space indentation (Prettier is source of truth).
        - Preserve reduced-motion and focus-visible rules.
    - path: "src/data/**"
      instructions: |
        - src/data/events.js is the single source of truth for events — the
          home section and /events share it. Keep fields minimal: remove
          anything nothing consumes.
    - path: "src/utils/**"
      instructions: |
        - Pure decision modules with zero JSX (ADR-0009).
        - Every pure module must have a corresponding unit spec in tests/unit/
          (enforced by scripts/maintenance/check-specs.mjs).
        - Keep modules deep: simple interfaces, hiding timing/state complexity.
    - path: "src/Components/HeroStage/**"
      instructions: |
        - Encapsulates 3D Three.js / Vanta lifecycle with graceful low-power fallback.
        - Must never throw on WebGL context loss (iOS background tab eviction guard).
    - path: "vite.config.js"
      instructions: |
        - The PWA precache is app-shell only. Photos must ship via the
          immutable HTTP cache, NEVER through the service worker.
        - Image optimizer, chunk splitting, and srcset config are tuned for
          bandwidth; propose changes with data, not preference.
    - path: ".github/workflows/**"
      instructions: |
        - CI runs root checks with pnpm only. Never run tooling against
          foces-webv23/ (archived studio, pinned Sanity 3 / React 18 on
          purpose).
    - path: "tests/**"
      instructions: |
        - Playwright E2E suite. Keep tests deterministic and resilient to
          device profile (slowNetwork/lowPower) degradation.
    - path: "scripts/**"
      instructions: |
        - Puppeteer probes + Lighthouse perf tests. Keep them dependency-light
          and runnable against `pnpm preview`.
    - path: "docs/**"
      instructions: |
        - Architecture decisions live in docs/adr/ following the template
          there. Do not duplicate decisions in prose.

  # Static analysis tools that add context to reviews.
  tools:
    eslint:
      enabled: true
      e18e:
        enabled: true
    oxc:
      enabled: true
    biome:
      enabled: true
    ast-grep:
      essential_rules: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    zizmor:
      enabled: true
    checkov:
      enabled: true
    trivy:
      enabled: true
    presidio:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: true
    languagetool:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true

  # Both title AND description are error-mode: with request_changes_workflow on,
  # a PR that violates either blocks merge until fixed.
  pre_merge_checks:
    title:
      mode: "error"
      requirements: |
        Must follow Conventional Commits: type[optional scope][!]: subject.
        Allowed types: feat|fix|perf|a11y|chore|docs|test|refactor|ci|build|
        style|revert. Scope is optional and only used when it adds context
        (e.g. 'revert: restore behavior' is valid without one); a '!' before
        the colon marks a breaking change (e.g. 'feat!: remove old API').
        Subject under ~72 characters, lowercase, no trailing period.
        Example: 'feat(events): add 2026 lineup carousel'.
    description:
      mode: "error"

chat:
  auto_reply: true
  allow_non_org_members: true
  art: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "CONTEXT.md"
      - "UBIQUITOUS_LANGUAGE.md"
      - "docs/adr/*.md"
  learnings:
    scope: "local"
    approval_delay: 0
  issues:
    scope: "local"
  pull_requests:
    scope: "local"

code_generation:
  unit_tests:
    path_instructions:
      - path: "src/utils/**/*.js"
        instructions: |
          Generate unit tests using Vitest (describe, it, expect, vi).
          Follow ADR-0009: pure logic test seams with deterministic mocks.
      - path: "src/hooks/**/*.js"
        instructions: |
          Generate unit tests using @testing-library/react (renderHook, act) with Vitest.

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
