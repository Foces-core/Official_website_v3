<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="FOCES - Forum of Computer Engineering Students" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark" />
    <title>
      FOCES - Forum of Computer Engineering Students | College of Engineering Chengannur
    </title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="FOCES - Forum of Computer Engineering Students | CEC" />
    <meta
      name="description"
      content="Official website of FOCES (Forum of Computer Engineering Students) at College of Engineering Chengannur. Discover upcoming events, workshops, technical initiatives, and meet our team."
    />
    <meta
      name="keywords"
      content="FOCES, CEC, Computer Engineering, College of Engineering Chengannur, Tech Club, Engineering Students, FOSS, Workshops, Events"
    />
    <meta name="theme-color" content="#101011" />

    <!-- iOS / mobile web app (PWA) meta tags: standalone full-screen launch,
         dark status bar to match the theme, and a proper 180px home-screen icon.
         apple-touch-icon is what iOS uses when "Add to Home Screen" is tapped. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FOCES" />
    <link rel="apple-touch-icon" href="/pwa-180.png" />
    <link rel="icon" type="image/svg+xml" href="/foces.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="mask-icon" href="/foces.svg" color="#101011" />
    <link rel="canonical" href="https://foces.org.in/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foces.org.in/" />
    <meta property="og:title" content="FOCES - Forum of Computer Engineering Students | CEC" />
    <meta
      property="og:description"
      content="Official website of FOCES at College of Engineering Chengannur. Explore events, team members, R&D initiatives, and student projects."
    />
    <meta property="og:image" content="https://foces.org.in/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://foces.org.in/" />
    <meta property="twitter:title" content="FOCES - Forum of Computer Engineering Students | CEC" />
    <meta
      property="twitter:description"
      content="Official website of FOCES at College of Engineering Chengannur. Explore events, team members, R&D initiatives, and student projects."
    />
    <meta property="twitter:image" content="https://foces.org.in/og-image.jpg" />

    <!-- Performance & Preloading Optimization Hints -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <!-- CDN guidance:
         - All static assets (JS/CSS/webp images) are bundled and served from
           Vercel's edge CDN, same origin as the site. Same-origin requests
           need NO preconnect — preconnect only helps cross-origin fetches.
         - The only cross-origin request on load is Vercel SpeedInsights
           (https://va.vercel-scripts.com), so only it is preconnected below.
         - IF hero/featured images are later moved to an external CDN
           (Cloudflare R2, Cloudinary, etc.), add one preconnect per image
           host and remove it if images come back same-origin:
             <link rel="preconnect" href="https://yourcdn.example.com" crossorigin />
           A wildcard preconnect for unused hosts wastes connection slots —
           only preconnect what actually loads above the fold.
         - (Sanity was removed; its old preconnect hints were dead weight.) -->
    <link rel="preconnect" href="https://va.vercel-scripts.com" crossorigin="anonymous" />
    <!-- Fonts are self-hosted via @fontsource (no render-blocking Google
         Fonts request; woff2 gets precached by the service worker). -->
    <!-- Critical first-paint CSS: inline so the browser paints the boot splash
         from the raw HTML document on parse — no waiting on the JS bundle or
         the 77KB Tailwind stylesheet. This is what makes FCP near-instant. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #101011;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        transition:
          opacity 0.7s ease,
          visibility 0.7s ease;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
      }
      #boot-splash .status {
        margin-top: 1rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #22d3ee;
        font-weight: 600;
      }
      #boot-splash.is-fading {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-[#101011] text-white">
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <img src="/foces.svg" width="96" height="96" alt="FOCES" decoding="async" />
      <span class="status">Loading...</span>
    </div>
    <div id="portal"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
