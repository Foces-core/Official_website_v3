allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Build-time only (postcss -> nanoid), but the advisory (<3.3.18) is flagged
# by audit/dependabot - pin the 3.x line across vite/tailwind/vitest.
# Dev-only (stryker -> typed-rest-client -> qs): the exact-pinned qs 6.15.1
# carries DoS advisories (GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx,
# GHSA-4mjr-xmp4-gh2g) that fail `pnpm audit` in CI - force the patched 6.16.0.
# brace-expansion is transitive (eslint -> minimatch/glob -> brace-expansion)
# and three separate major lines are in the tree, each with its own advisories:
# 1.x needs 1.1.21, 2.x needs 2.1.7, 5.x needs 5.0.12. Every parent already
# declares a range that permits the patched version (^1.1.7, ^2.0.1, ^5.0.0),
# so these pins only pull the fixes the lockfile was too stale to resolve - a
# plain `pnpm dedupe` does not upgrade, and `pnpm update --depth` rewrites the
# direct dependency ranges too.
overrides:
  fast-uri: 4.2.3
  nanoid: ^6.0.0
  qs: 6.17.1
  serialize-javascript: 7.1.4
  'brace-expansion@>=1.0.0 <1.1.21': 5.0.13
  'brace-expansion@>=2.0.0 <2.1.7': 5.0.13
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.13
  # GHSA-3g3m-2fjr-6pw4 (glob AbortSignal bypass, <14.0.2 via @sentry/bundler-plugins
  # and lighthouse) fails `pnpm audit` in CI. The pin pulls the patched release; a
  # plain dedupe cannot upgrade this transitive resolution.
  'glob@>=9.0.0 <=14.0.1': 14.0.5

# No fix is published for this low-severity advisory. deepmerge is only pulled
# into the build toolchain by workbox-build; remove this exception when fixed.
audit:
  ignore:
    - GHSA-gcqx-w48m-w2h4
    # minimatch globparts DoS (>=7 <11.0.1) is dev-toolchain only (eslint, stryker,
    # glob) and cannot be patched: eslint-plugin-import-x imports makeRe, which
    # minimatch 11 removed, so a global override breaks the lint config. Remove
    # this exception once eslint-plugin-import-x supports minimatch 11.
    - GHSA-g3hv-75wg-m249
